<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #191919;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
    }

    .ct-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .ct-event-name {
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      color: #fff;
      margin-bottom: 2rem;
    }

    .ct-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 2rem;
    }

    .ct-card {
      background: #111;
      border-radius: 12px;
      padding: 1.25rem 0.75rem 1rem;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.12);
    }

    .ct-number {
      font-family: 'DM Mono', monospace;
      font-size: 42px;
      font-weight: 300;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .ct-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .ct-progress-bar {
      height: 2px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .ct-progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      transition: width 1s linear;
      width: 0%;
    }

    .ct-done {
      text-align: center;
      padding: 3rem 0 1rem;
      font-size: 22px;
      font-weight: 500;
      color: #fff;
    }

    .ct-done-sub {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      margin-top: 0.5rem;
    }

    @media (max-width: 400px) {
      .ct-number { font-size: 28px; }
      .ct-grid { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="countdown-area">
      <div class="ct-grid">
        <div class="ct-card"><div class="ct-number" id="days">--</div><div class="ct-label">Tage</div></div>
        <div class="ct-card"><div class="ct-number" id="hours">--</div><div class="ct-label">Stunden</div></div>
        <div class="ct-card"><div class="ct-number" id="minutes">--</div><div class="ct-label">Minuten</div></div>
        <div class="ct-card"><div class="ct-number" id="seconds">--</div><div class="ct-label">Sekunden</div></div>
      </div>
      <div class="ct-progress-bar"><div class="ct-progress-fill" id="progress"></div></div>
    </div>

    <div id="done-area" style="display:none">
      <div class="ct-done">🎉 Es ist soweit!</div>
      <div class="ct-done-sub">Der Starttermin ist erreicht.</div>
    </div>
  </div>

  <script>
    const targetMs = new Date('2026-08-31T08:00:00').getTime();
    const startMs  = Date.now();

    function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

    function tick() {
      const now  = Date.now();
      const diff = targetMs - now;

      if (diff <= 0) {
        ['days','hours','minutes','seconds'].forEach(id => {
          document.getElementById(id).textContent = '00';
        });
        document.getElementById('progress').style.width = '100%';
        document.getElementById('countdown-area').style.display = 'none';
        document.getElementById('done-area').style.display = 'block';
        clearInterval(interval);
        return;
      }

      const totalSec = diff / 1000;
      document.getElementById('days').textContent    = pad(Math.floor(totalSec / 86400));
      document.getElementById('hours').textContent   = pad(Math.floor((totalSec % 86400) / 3600));
      document.getElementById('minutes').textContent = pad(Math.floor((totalSec % 3600) / 60));
      document.getElementById('seconds').textContent = pad(Math.floor(totalSec % 60));

      const total   = targetMs - startMs;
      const elapsed = now - startMs;
      const pct     = Math.min(100, Math.max(0, (elapsed / total) * 100));
      document.getElementById('progress').style.width = pct.toFixed(3) + '%';
    }

    tick();
    const interval = setInterval(tick, 1000);
  </script>
</body>
</html>
